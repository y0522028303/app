plugins { id 'com.android.application' }
android {
    namespace 'com.nova.mp3'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nova.mp3'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '2.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}